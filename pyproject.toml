[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algo-pkg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/algo_pkg"]

[project.scripts]
algo = "algo_pkg.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
