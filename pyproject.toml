[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algo-pkg"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/algo_pkg"]

[project.scripts]
algo = "algo_pkg.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py", "tests.py"]

[tool.ruff]
line-length = 100
target-version = "py314"
