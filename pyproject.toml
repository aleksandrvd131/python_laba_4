[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algo-pkg"
version = "0.1.0"
description = "Алгоритмический мини-пакет (Python 3.14)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/algo_pkg"]

[project.scripts]
algo = "algo_pkg.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
